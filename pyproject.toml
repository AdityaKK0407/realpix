[project]
name = "realpix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "opencv-python>=4.9,<4.12",
    "timm>=1.0,<1.1",
    "tqdm>=4.66,<5",
    "torch",
    "torchvision",
    "torchaudio",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.8.0",
    "onnxscript>=0.7.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.25.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
